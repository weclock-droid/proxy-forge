name: verify

# The page is published from this repo, so a stale build or a broken layout should fail here rather
# than reach the live site. `--check` fails if proxy-forge.html no longer matches the markdown it is
# built from; the tests drive a real browser with the CDNs and Scryfall stubbed, so nothing hits the
# network and the run is deterministic. The real-card pass renders the committed Scryfall fixtures,
# which is the same stub-and-render trick over 48 real cards instead of the hand-written ones — it
# fails on text pushed outside the safety margin, and reports (without failing) the planeswalker and
# battle fields the tool does not understand yet.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run real-cards

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - name: Stage public site files
        run: |
          mkdir -p _site
          cp index.html proxy-forge.html _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
